{% load static%}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/style1.css'%}" />
  </head>
  <body>
    <div
      class="background"
      style="
        background-image: linear-gradient(
            to top,
            rgba(0, 0, 0, 0.5),
            rgba(0, 0, 0, 0.5)
          ),
          url('{% static 'img/img1.png'%}');
      "
    >
      <div class="navbar">
        <img src="{% static 'img/logo2.png' %}" class="logo" />
        <h2 class="logo l1">HawaiYatra</h2>
      </div>
      <div class="booking-form">
        <h2>Book Your Flight</h2>
        <form action="{% url 'user:result' %}" method="post">
          <label for="departure">From:</label>
          <select id="departure" name="from_from" required>
            <option value="">Select City</option>
            <option value="NEW DELHI">NEW DELHI</option>
            <option value="MUMBAI">MUMBAI</option>
            <option value="BANGALORE">BANGALORE</option>
            <option value="CHENNAI">CHENNAI</option>
          </select>
          <label for="arrival">To:</label>
          <select id="arrival" name="to_to" required>
            <option value="">Select City</option>
            <option value="NEW DELHI">NEW DELHI</option>
            <option value="MUMBAI">MUMBAI</option>
            <option value="BANGALORE">BANGALORE</option>
            <option value="CHENNAI">CHENNAI</option>
          </select>
          <label for="count">Number of travellers:</label>
          <select id="count" name="count" required>
            <option value="">Select number of travellers</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
          <label for="cabin">Choose cabin class:</label>
          <select id="cabin" name="flight_class" required>
            <option value="">Select cabin class</option>
            <option value="ECONOMY">ECONOMY</option>
            <option value="PREMIUM ECONOMY">PREMIUM ECONOMY</option>
            <option value="BUSINESS">BUSINESS</option>
          </select>
          <label for="date">Date of Travel:</label>
          <input type="date" id="date" name="date" required />
          <button type="submit" value="show flights">Show Flight</button>
        </form>
      </div>
    </div>
  </body>
</html>
